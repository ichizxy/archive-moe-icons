name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install image dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify renderer and icon assets
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Verify registry backup and restore
        shell: powershell
        run: .\tests\Test-IconScripts.ps1
      - name: Verify desktop window initialization
        run: python ".\工具\icon_customizer.py" --smoke-ui
